<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080c10" />
  <meta name="description" content="Follow your curiosity. An interactive, continuous feed of ideas, living diagrams, and little rabbit holes. A Wiskers concept demo." />
  <meta name="robots" content="noindex" />
  <title>scrollo — follow your curiosity</title>
  <link rel="icon" type="image/svg+xml" href="/scroll-icon.svg" />
  <link rel="stylesheet" href="/src/scroll/scroll.css" />
</head>
<body>
  <canvas id="world" aria-hidden="true"></canvas>
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <header class="topbar">
    <a href="/scroll/" class="wordmark" aria-label="Scrollo home"><svg viewBox="0 0 36 24" fill="none" aria-hidden="true"><path d="M18 12C8-5-3 5 5 15c7 10 19-11 25-7 10 8-5 21-12 4Z" stroke="currentColor" stroke-width="2.2"/></svg>scrollo<span class="wordmark-dot">.</span></a>
    <button class="flow-pill" data-open="tune"><span class="status-dot"></span><span id="flow-name">Curiosity flow</span><span class="tiny-chevron">⌄</span></button>
    <nav aria-label="Demo controls">
      <button class="icon-button" data-open="library" aria-label="Explore the feed" title="Explore the feed"></button>
      <button class="icon-button sound-button" id="sound-toggle" aria-label="Enable ambient sound" aria-pressed="false" title="Ambient sound"></button>
      <button class="profile-button" data-open="profile" aria-label="Your collection">J</button>
    </nav>
  </header>
  <div class="edge edge-tl"><button id="hide-action" class="corner" aria-label="Show less like this"><span class="corner-icon"></span><span class="corner-label">Less like this <kbd>↖</kbd></span></button></div>
  <div class="edge edge-tr"><button data-open="friends" class="corner" aria-label="Talk about this with a friend"><span class="corner-icon"></span><span class="corner-label">Talk with a friend <kbd>↗</kbd></span><span class="online-dot"></span></button></div>
  <div class="edge edge-bl"><button id="like-action" class="corner" aria-label="Like this topic" aria-pressed="false"><span class="corner-icon"></span><span class="corner-label">More like this <kbd>↙</kbd></span></button></div>
  <div class="edge edge-br"><button data-open="comments" class="corner" aria-label="Open this topic’s comments"><span class="corner-icon"></span><span class="corner-label">Join the conversation <kbd>↘</kbd></span><span id="comment-count">3</span></button></div>
  <aside class="journey" aria-label="Feed position"><div class="journey-line"></div><div id="journey-dots"></div></aside>
  <main id="feed" aria-label="Your curiosity feed"></main>
  <footer class="flowbar">
    <button class="help-button" data-open="guide"><span class="gesture-glyph">✧</span><span>Make it your flow</span></button>
    <div class="scroll-invitation"><span class="mouse-mark"></span><span id="scroll-caption">Just keep scrolling</span></div>
    <button class="tune-button" data-open="tune"><span id="tune-icon"></span><span>Tune your feed</span></button>
  </footer>
  <div id="gesture-preview" aria-hidden="true"><span id="gesture-preview-icon"></span><span id="gesture-preview-text"></span><div class="gesture-meter"></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="overlay" hidden>
    <button class="scrim" aria-label="Close panel" tabindex="-1"></button>
    <section id="drawer" role="dialog" aria-modal="true" aria-labelledby="panel-title" tabindex="-1">
      <header class="panel-header"><div><span class="eyebrow" id="panel-kicker"></span><h2 id="panel-title"></h2></div><button id="close-panel" class="icon-button" aria-label="Close panel"></button></header>
      <div id="panel-body"></div>
    </section>
  </div>
  <noscript><p class="no-script">Scrollo is an interactive demo. Please enable JavaScript to explore it.</p></noscript>
  <script type="module" src="/src/scroll/app.js"></script>
</body>
</html>
