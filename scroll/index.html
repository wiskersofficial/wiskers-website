<!doctype html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
 <meta name="theme-color" content="#0d1014" />
 <meta name="description" content="News, good nonsense, little discoveries. One continuous feed you steer with a swipe." />
 <meta name="robots" content="noindex" />
 <title>scrollo — less same, more surprise</title>
 <link rel="icon" type="image/svg+xml" href="/scroll-icon.svg" />
 <link rel="stylesheet" href="/src/scroll/scroll.css" />
</head>
<body>
 <canvas id="world" aria-hidden="true"></canvas>
 <div class="atmosphere" aria-hidden="true"></div>
 <header class="brand"><button data-open="collection" aria-label="Your saved ideas and settings">scrollo<span>.</span></button><span id="mix-label">a little less predictable</span></header>
 <div class="bezel bezel-tl" data-action="less"><svg viewBox="0 0 180 180" fill="none" aria-hidden="true"><path class="bezel-track" d="M3 177V33Q3 3 33 3H177"/><path class="bezel-light" pathLength="1" d="M3 177V33Q3 3 33 3H177"/></svg><button aria-label="Show less like this"><span class="bezel-icon"></span><span class="bezel-label">Less of this</span></button></div>
 <div class="bezel bezel-tr" data-action="friend"><svg viewBox="0 0 180 180" fill="none" aria-hidden="true"><path class="bezel-track" d="M3 177V33Q3 3 33 3H177"/><path class="bezel-light" pathLength="1" d="M3 177V33Q3 3 33 3H177"/></svg><button aria-label="Talk with a friend"><span class="bezel-icon"></span><span class="bezel-label">Bring a friend</span></button></div>
 <div class="bezel bezel-bl" data-action="like"><svg viewBox="0 0 180 180" fill="none" aria-hidden="true"><path class="bezel-track" d="M3 177V33Q3 3 33 3H177"/><path class="bezel-light" pathLength="1" d="M3 177V33Q3 3 33 3H177"/></svg><button aria-label="Like this idea" aria-pressed="false"><span class="bezel-icon"></span><span class="bezel-label">More like this</span></button></div>
 <div class="bezel bezel-br" data-action="comments"><svg viewBox="0 0 180 180" fill="none" aria-hidden="true"><path class="bezel-track" d="M3 177V33Q3 3 33 3H177"/><path class="bezel-light" pathLength="1" d="M3 177V33Q3 3 33 3H177"/></svg><button aria-label="Open this idea’s comments"><span class="bezel-icon"></span><span class="bezel-label">The conversation</span></button></div>
 <main id="feed" aria-label="Your continuous feed"></main>
 <div class="flow-status"><span class="flow-dot"></span><span id="flow-status">scroll. wander. repeat.</span></div>
 <div id="onboarding" aria-hidden="true">Swipe a corner.<br><span>Shape what comes next.</span></div>
 <div id="toast" role="status" aria-live="polite"></div>
 <div id="overlay" hidden><button class="scrim" aria-label="Close conversation" tabindex="-1"></button><section id="drawer" role="dialog" aria-modal="true" aria-labelledby="panel-title" tabindex="-1"><header class="panel-header"><div><span id="panel-kicker"></span><h2 id="panel-title"></h2></div><button id="close-panel" aria-label="Close panel"></button></header><div id="panel-body"></div></section></div>
 <noscript><p style="padding:120px 10vw">Please enable JavaScript to wander through Scrollo.</p></noscript>
 <script type="module" src="/src/scroll/app.js"></script>
</body>
</html>
