<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wiskers cat style options</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--page:#f3f0e9;--ink:#091540;--muted:#4c5573;--surface:#faf9f5;--line:#d5d7d5}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 'DM Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}main{max-width:1200px;padding:40px 34px 42px;margin:auto}header{display:flex;justify-content:space-between;align-items:start;gap:24px;margin-bottom:30px}h1{font-size:38px;letter-spacing:-.055em;font-weight:500;line-height:1.1;margin:0 0 12px}header p{color:var(--muted);margin:0;max-width:620px;font-size:15px}.themes{display:flex;gap:5px;flex:none;border:1px solid var(--line);padding:4px;border-radius:30px}button{cursor:pointer;border:0;border-radius:22px;font:600 11px 'DM Sans',sans-serif;padding:9px 12px;background:none;color:var(--ink)}button[aria-pressed=true]{background:var(--ink);color:var(--page)}button:focus-visible,a:focus-visible{outline:3px solid #2f97c1;outline-offset:4px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}.art{height:240px;display:flex;justify-content:center;align-items:center;background:var(--page)}svg{display:block;image-rendering:pixelated;overflow:hidden}.art svg{height:205px;width:210px}.info{padding:23px 23px 24px;border-top:1px solid var(--line)}h2{font-weight:500;font-size:23px;letter-spacing:-.045em;line-height:1.2;margin:0 0 11px}.description{color:var(--muted);font-size:13px;line-height:1.6;margin:0;min-height:63px}.small{display:flex;justify-content:space-between;align-items:center;gap:14px;border-top:1px solid var(--line);margin-top:22px;padding-top:17px}.small p{font-size:11px;color:var(--muted);margin:0;max-width:130px}.small svg{width:80px;height:88px;flex:none}.bottom{margin-top:24px;display:flex;justify-content:space-between;gap:25px;font-size:13px;color:var(--muted)}a{color:inherit;text-underline-offset:4px}
@media(max-width:700px){main{padding:28px 22px}header{display:block}.themes{width:max-content;margin-top:22px}.cards{grid-template-columns:1fr}.art{height:230px}.description{min-height:0}.bottom{display:block}.bottom p{margin-top:10px}}body[data-mode=twilight]{color-scheme:dark;--page:#160f24;--ink:#f3f0e9;--muted:#c5b8d0;--surface:#241a32;--line:#534262}
.card{display:flex;flex-direction:column}.info{display:flex;flex:1;flex-direction:column}.description{flex:1}.small{flex:none}
</style></head><body><main><header><div><h1>Three ways to be a little cuter.</h1><p>The same ginger, blue-eyed cat in three pixel-art styles. Compare the enlarged view and the small website-size preview.</p></div><div class="themes" role="group" aria-label="Preview background"><button aria-pressed="true" data-mode="day">Day</button><button aria-pressed="false" data-mode="twilight">Twilight</button></div></header><div class="cards" id="cards"></div><div class="bottom"><span>Pick A, B, or C in the chat. The current website cat is unchanged.</span><a href="/">Back to the website</a></div></main>
<script>
const styles=[{id:'A',name:'Soft classic',file:'a-soft-classic.png',description:'Closest to the current cat, with softer cheeks and a gentle, happy expression.'},{id:'B',name:'Chunky retro',file:'b-chunky-retro-v2.png',description:'Larger pixel shapes and fewer colours for a simple, friendly game-sprite look.'},{id:'C',name:'Round and playful',file:'c-round-playful.png',description:'A rounder face, slightly bigger eyes, and more compact proportions.'}];
fetch('/art/cat-styles-v1/options.json').then(r=>r.json()).then(metadata=>{
 const svg=(style)=>{const m=metadata[style.id];return `<svg viewBox="${m.viewBox.join(' ')}" role="img" aria-label="${style.name} ginger cat"><image href="/art/cat-styles-v1/${style.file}" width="${m.width}" height="${m.height}"/></svg>`};
 document.querySelector('#cards').innerHTML=styles.map(s=>`<article class="card"><div class="art">${svg(s)}</div><div class="info"><h2>${s.id}. ${s.name}</h2><p class="description">${s.description}</p><div class="small"><p>At roughly website size</p>${svg(s)}</div></div></article>`).join('');
});
document.querySelectorAll('button[data-mode]').forEach(button=>button.addEventListener('click',()=>{document.body.dataset.mode=button.dataset.mode;document.querySelectorAll('button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));
</script></body></html>
